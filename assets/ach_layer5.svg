<defs><clipPath id="clip"><rect width="405" height="104" rx="16"/></clipPath></defs>
<rect x="0.5" y="0.5" width="404" height="103" rx="16" fill="#000000" stroke="#1f1f1f"/><rect x="0.5" y="0.5" width="404" height="103" rx="16" fill="none" stroke="url(#beam)" stroke-width="1.3" stroke-dasharray="110 881" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-991" dur="7s" repeatCount="indefinite"/></rect>
<g clip-path="url(#clip)"><circle cx="50" cy="50" r="60" fill="#A78BFA" opacity="0.10" filter="url(#blur)"/></g>
<g transform="translate(30,32)"><polygon points="20,0 38,10 38,30 20,40 2,30 2,10" fill="none" stroke="#A78BFA" stroke-width="1.6"/><polygon points="20,10 29,15 29,25 20,30 11,25 11,15" fill="#A78BFA" opacity="0.25"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/></polygon></g>
<text x="96" y="46" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#A78BFA">FIRST DESIGN</text>
