<svg xmlns="http://www.w3.org/2000/svg" width="405" height="104" viewBox="0 0 405 104" role="img" aria-label="FIRST DESIGN"><title>FIRST DESIGN</title>
<defs>
  <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="405" y2="104">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#ededed"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  <radialGradient id="fadeR" cx="0.3" cy="0.35" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridmask"><rect width="405" height="104" fill="url(#fadeR)"/></mask>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
